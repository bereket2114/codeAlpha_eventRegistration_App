<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <!-- Background -->
  <rect width="800" height="400" fill="#f4f6f8" />
  
  <!-- LEFT COLUMN: TEXT CONTENT BOX -->
  <!-- Text Box Background & Border -->
  <rect x="50" y="50" width="440" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
  
  <!-- Event Title -->
  <text x="80" y="110" font-family="sans-serif" font-weight="bold" font-size="26" fill="#1a1a2e">Annual Tech Symposium 2026</text>
  
  <!-- Event Date -->
  <text x="80" y="145" font-family="sans-serif" font-weight="normal" font-size="16" fill="#6c757d">📅 October 24, 2026 • 10:00 AM</text>
  
  <!-- Event Description Lines -->
  <rect x="80" y="180" width="380" height="12" rx="4" fill="#e2e8f0" />
  <rect x="80" y="205" width="360" height="12" rx="4" fill="#e2e8f0" />
  <rect x="80" y="230" width="320" height="12" rx="4" fill="#e2e8f0" />
  <rect x="80" y="255" width="280" height="12" rx="4" fill="#e2e8f0" />


  <!-- RIGHT COLUMN: IMAGE UPLOAD BOX -->
  <!-- Image Box Background & Border (with a 30px margin from the left box) -->
  <rect x="520" y="50" width="230" height="300" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
  
  <!-- Inner Image Placeholder Area -->
  <rect x="540" y="70" width="190" height="260" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6,6" />
  
  <!-- Placeholder Icon / Text -->
  <circle cx="635" cy="180" r="30" fill="#e2e8f0" />
  <path d="M620 190 L635 170 L650 195 Z" fill="#cbd5e1" />
  <circle cx="627" cy="165" r="6" fill="#cbd5e1" />
  <text x="635" y="240" font-family="sans-serif" font-weight="bold" font-size="14" fill="#94a3b8" text-anchor="middle">IMAGE AREA</text>
</svg>
